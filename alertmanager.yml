route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'slack'
receivers:
- name: 'slack'
  slack_configs:
  - api_url: '<slack_webhook_url>'
    channel: '#all-fraud-alerts'
    send_resolved: true

    title: '{{ .CommonLabels.alertname }}'

    text: |
      *Alert:* {{ .CommonLabels.alertname }}
      *Status:* {{ .Status }}
      *Severity:* {{ .CommonLabels.severity }}
      *Summary:* {{ .CommonAnnotations.summary }}
      *Description:* {{ .CommonAnnotations.description }}
      *Time:* {{ .Alerts.Firing | len }} Active Alert(s)

      {{ range .Alerts }}
      {{ .Annotations.summary }}
      {{ end }}
